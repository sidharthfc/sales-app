exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "route_sales.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles, and the PWA
        # frontend (frontend/) — it lints/formats itself via its own
        # eslint.config.js + `npm run lint`, which this old mirror can't
        # read (flat config, unsupported by mirrors-eslint's pinned v8).
        exclude: |
            (?x)^(
                route_sales/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                route_sales/templates/includes/.*|
                route_sales/public/js/lib/.*|
                frontend/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles, and the PWA
        # frontend (frontend/) — see prettier hook above for why.
        exclude: |
            (?x)^(
                route_sales/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                route_sales/templates/includes/.*|
                route_sales/public/js/lib/.*|
                frontend/.*
            )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
